aid: evommune
name: Evommune
description: 'Evommune, Inc. (Nasdaq: EVMN) is a clinical-stage biopharmaceutical company
  headquartered in Palo Alto, California, discovering and developing therapies that target
  the key drivers of chronic inflammatory disease. Founded in 2020 by the team behind
  Dermira, the company applies a human tissue-based translational approach to immunology
  and is advancing a clinical pipeline that includes EVO756, an oral small-molecule
  MRGPRX2 antagonist in Phase 2b development for chronic spontaneous urticaria and
  migraine prophylaxis, and an IL-18 binding protein fusion program licensed from
  AprilBio. Evommune publishes no developer program, no public API and no machine-readable
  API contract; its public web presence is a WordPress marketing site plus a hosted
  investor-relations portal.'
